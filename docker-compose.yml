services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: apexdetail
      POSTGRES_PASSWORD: apexdetail
      POSTGRES_DB: apexdetail
    ports:
      - "5432:5432"
    volumes:
      - apexdetail_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apexdetail"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  apexdetail_postgres:

